<div style="flex: 1">
  <app-header></app-header>

  <div style="padding: 1rem">
    <router-outlet />
  </div>

  @if (bridge.modalRequest(); as modal) {
    <simi-modal [opened]="true" size="md" (simi-modal-close)="bridge.closeModal()">
      <span slot="header">{{ modal.title }}</span>
      {{ modal.message }}
    </simi-modal>
  }
  @if (bridge.toasts().length) {
    <div class="hub-toast-stack" role="status" aria-live="polite">
      @for (toast of bridge.toasts(); track toast.id) {
        <simi-chip
          [color]="toast.variant === 'error' ? 'secondary' : 'primary'"
          removable
          (simi-chip-close)="bridge.dismissToast(toast.id)"
        >
          {{ toast.message }}
        </simi-chip>
      }
    </div>
  }
</div>

<footer class="footer">
  <div>
    <span>Powered by Simi</span>
  </div>
</footer>
